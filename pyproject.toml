[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "sensorforge"
version = "0.2.0"
description = "Catalogue-driven evolutionary inverse design of capacitive pressure sensors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "streamlit>=1.40,<2", "plotly>=5.24,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
data = ["openpyxl>=3.1,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.tmp/pytest"
